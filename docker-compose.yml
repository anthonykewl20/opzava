x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.6.1
    restart: unless-stopped
    logging: *json-file-logging
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=dokploy-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dokploy-network

  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    logging: *json-file-logging
    environment:
      POSTGRES_DB: opzava
      POSTGRES_USER: opzava
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - opzava-pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opzava -d opzava"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    logging: *json-file-logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_URL: ${APP_URL:-http://web.opzava.localhost:18088}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://web.opzava.localhost:18088}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://opzava_app:opzava_app_local_only@postgres:5432/opzava}
      BROKER_INTERNAL_URL: ${COMPOSE_BROKER_INTERNAL_URL:-http://gateway-broker:19088}
      BROKER_INTERNAL_TOKEN: ${BROKER_INTERNAL_TOKEN:?BROKER_INTERNAL_TOKEN is required}
      PROVISIONING_WORKER_URL: ${COMPOSE_PROVISIONING_WORKER_URL:-http://provisioning-worker:19188}
      PROVISIONING_WORKER_TOKEN: ${PROVISIONING_WORKER_TOKEN:?PROVISIONING_WORKER_TOKEN is required}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-opzava-task-evidence}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_ENDPOINT: ${COMPOSE_OBJECT_STORE_ENDPOINT:-http://minio:9000}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-opzava_minio_local}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-opzava_minio_local_only_not_for_shared_envs}
      # GitHub token for the Issues surface (IssueTrackerPort GitHub adapter). Internal-phase
      # dev config path; sourced from .env (gitignored), never committed. Vault ref supersedes
      # this once the provisioning-worker GitHub device-flow connect is live.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # DATABASE_MIGRATION_URL is intentionally not passed to runtime services.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      gateway-broker:
        condition: service_healthy
      provisioning-worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.opzava-web.rule: "Host(`web.opzava.localhost`)"
      traefik.http.routers.opzava-web.entrypoints: "web"
      traefik.http.services.opzava-web.loadbalancer.server.port: "3000"
      traefik.docker.network: "dokploy-network"
    networks:
      - dokploy-network

  provisioning-worker:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *json-file-logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PROVISIONING_WORKER_PORT:-19188}
      PROVISIONING_WORKER_TOKEN: ${PROVISIONING_WORKER_TOKEN:?PROVISIONING_WORKER_TOKEN is required}
      OPZAVA_PLATFORM_ORGANIZATION_ID: ${OPZAVA_PLATFORM_ORGANIZATION_ID:?OPZAVA_PLATFORM_ORGANIZATION_ID is required}
      # #192: the connections governance audit appends compliance rows to Postgres from the worker,
      # so it needs the app-role DATABASE_URL (RLS-enforced, INSERT/SELECT only) like web/broker.
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://opzava_app:opzava_app_local_only@postgres:5432/opzava}
      OPENCLAW_GATEWAY_URL: ${COMPOSE_OPENCLAW_GATEWAY_URL:-ws://openclaw-platform-gateway:18789}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # Worker JIT-admin operator scopes; must match the paired worker-admin device.
      OPENCLAW_OPERATOR_SCOPES: ${WORKER_OPENCLAW_OPERATOR_SCOPES:-operator.read,operator.admin}
      # Dedicated worker operator device — two-token boundary: a SEPARATE paired
      # device from the broker's hot-path device (never share one device identity;
      # the gateway rejects concurrent connections from the same device).
      OPENCLAW_OPERATOR_DEVICE_TOKEN: ${WORKER_OPENCLAW_OPERATOR_DEVICE_TOKEN:-}
      OPENCLAW_DEVICE_TOKEN_VAULT_TENANT_ID: ${WORKER_OPENCLAW_DEVICE_TOKEN_VAULT_TENANT_ID:-platform}
      OPENCLAW_DEVICE_TOKEN_VAULT_LABEL: ${WORKER_OPENCLAW_DEVICE_TOKEN_VAULT_LABEL:-platform-worker-admin-device-token}
      OPENCLAW_DEVICE_TOKEN_VAULT_VERSION: ${WORKER_OPENCLAW_DEVICE_TOKEN_VAULT_VERSION:-}
      OPENCLAW_DEVICE_PRIVATE_KEY_PEM_BASE64: ${WORKER_OPENCLAW_DEVICE_PRIVATE_KEY_PEM_BASE64:-}
      OPENCLAW_DEVICE_PRIVATE_KEY_PEM: ${WORKER_OPENCLAW_DEVICE_PRIVATE_KEY_PEM:-}
      OPENCLAW_DEVICE_ID: ${WORKER_OPENCLAW_DEVICE_ID:-}
      OPENCLAW_DEVICE_PUBLIC_KEY: ${WORKER_OPENCLAW_DEVICE_PUBLIC_KEY:-}
      OPENCLAW_DEV_SECRETS_FILE: ${COMPOSE_OPENCLAW_DEV_SECRETS_FILE:-/run/opzava-secrets/openclaw-secrets.json}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_ISSUES_REPOSITORY: ${GITHUB_ISSUES_REPOSITORY:-anthonykewl20/opzava}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.44}
    depends_on:
      openclaw-platform-gateway:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    volumes:
      - ${OPENCLAW_DEV_SECRETS_DIR:-./.dev-secrets}:/run/opzava-secrets:rw
    expose:
      - "19188"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:19188/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dokploy-network

  gateway-broker:
    build:
      context: .
      dockerfile: apps/gateway-broker/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *json-file-logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${GATEWAY_BROKER_PORT:-19088}
      BROKER_INTERNAL_TOKEN: ${BROKER_INTERNAL_TOKEN:?BROKER_INTERNAL_TOKEN is required}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://opzava_app:opzava_app_local_only@postgres:5432/opzava}
      OPENCLAW_GATEWAY_URL: ${COMPOSE_OPENCLAW_GATEWAY_URL:-ws://openclaw-platform-gateway:18789}
      OPENCLAW_GATEWAY_ROUTE_ID: ${OPENCLAW_GATEWAY_ROUTE_ID:-platform-openclaw}
      # Internal single-tenant default for the seeded Anito org. The broker
      # verifies at boot that this resolves to the org in first_owner_setup and
      # refuses to start (naming both ids) if it has drifted — see #199.
      OPENCLAW_GATEWAY_TENANT_ID: ${OPENCLAW_GATEWAY_TENANT_ID:-93b43f1a-1d25-406d-b52c-8b4fd3cde01d}
      OPENCLAW_DEV_SECRETS_FILE: ${COMPOSE_OPENCLAW_DEV_SECRETS_FILE:-/run/opzava-secrets/openclaw-secrets.json}
      OPENCLAW_DEVICE_TOKEN_VAULT_TENANT_ID: ${OPENCLAW_DEVICE_TOKEN_VAULT_TENANT_ID:-platform}
      OPENCLAW_DEVICE_TOKEN_VAULT_LABEL: ${OPENCLAW_DEVICE_TOKEN_VAULT_LABEL:-platform-operator-device-token}
      OPENCLAW_DEVICE_TOKEN_VAULT_VERSION: ${OPENCLAW_DEVICE_TOKEN_VAULT_VERSION:-}
      OPENCLAW_OPERATOR_DEVICE_TOKEN: ${OPENCLAW_OPERATOR_DEVICE_TOKEN:-}
      OPENCLAW_DEVICE_PRIVATE_KEY_PEM_BASE64: ${OPENCLAW_DEVICE_PRIVATE_KEY_PEM_BASE64:-}
      OPENCLAW_DEVICE_PRIVATE_KEY_PEM: ${OPENCLAW_DEVICE_PRIVATE_KEY_PEM:-}
      OPENCLAW_DEVICE_ID: ${OPENCLAW_DEVICE_ID:-}
      OPENCLAW_DEVICE_PUBLIC_KEY: ${OPENCLAW_DEVICE_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      openclaw-platform-gateway:
        condition: service_healthy
    volumes:
      - ${OPENCLAW_DEV_SECRETS_DIR:-./.dev-secrets}:/run/opzava-secrets:ro
    expose:
      - "19088"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:19088/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.opzava-gateway-broker.rule: "Host(`gateway-broker.opzava.localhost`)"
      traefik.http.routers.opzava-gateway-broker.entrypoints: "web"
      traefik.http.services.opzava-gateway-broker.loadbalancer.server.port: "19088"
      traefik.docker.network: "dokploy-network"
    networks:
      - dokploy-network

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:${DOCKER_SOCKET_PROXY_IMAGE_TAG:-v0.4.2}
    restart: unless-stopped
    logging: *json-file-logging
    environment:
      LOG_LEVEL: warning
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 1
      DELETE: 1
      BUILD: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 1
      IMAGES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - dokploy-network

  minio:
    image: quay.io/minio/minio:${MINIO_IMAGE_TAG:-RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    logging: *json-file-logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opzava_minio_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-opzava_minio_local_only_not_for_shared_envs}
    volumes:
      - opzava-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dokploy-network

  minio-bucket-init:
    image: quay.io/minio/mc:${MINIO_MC_IMAGE_TAG:-RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opzava_minio_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-opzava_minio_local_only_not_for_shared_envs}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-opzava-task-evidence}
    entrypoint:
      - "/bin/sh"
      - "-c"
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc
        mb --ignore-existing "local/$${OBJECT_STORE_BUCKET}"
    networks:
      - dokploy-network

  openclaw-platform-gateway:
    # Built from the Opzava-owned tracked fork at ./mainframe (ADR-016, Q18);
    # previously pulled ghcr.io/openclaw/openclaw at the same version. Pin
    # record: mainframe/UPSTREAM.md. Still expose-only, no Traefik labels, so
    # there is no routable orphan Gateway. Local and Dokploy both build this.
    build:
      context: ./mainframe
      args:
        # Bakes the pinned Claude Code CLI into the gateway so Anthropic setup-token /
        # claude-cli auth flows run in-container (PATCHES.md #1). Match the host pin.
        OPZAVA_CLAUDE_CODE_VERSION: ${OPZAVA_CLAUDE_CODE_VERSION:-2.1.207}
        OPENCLAW_EXTENSIONS: "zai deepseek moonshot cloudflare-ai-gateway"
    image: opzava/mainframe-gateway:${OPENCLAW_IMAGE_TAG:-2026.7.2-beta.3}
    restart: unless-stopped
    init: true
    logging: *json-file-logging
    command: ["node", "openclaw.mjs", "gateway", "--port", "18789", "--bind", "lan"]
    environment:
      OPENCLAW_SKIP_ONBOARDING: ${OPENCLAW_SKIP_ONBOARDING:-1}
      OPENCLAW_DISABLE_BONJOUR: ${OPENCLAW_DISABLE_BONJOUR:-1}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
    volumes:
      - openclaw-platform-config:/home/node/.openclaw
      - openclaw-platform-workspace:/home/node/.openclaw/workspace
      - openclaw-platform-auth-profiles:/home/node/.config/openclaw
      # Provide the canonical agent-workspace IDENTITY.md the image ships only as
      # IDENTITY.dev.md, so the heartbeat's ensureAgentWorkspace resolves it
      # (no image rebuild). Baking it into mainframe is the cleaner long-term fix.
      - ./mainframe/docs/reference/templates/IDENTITY.dev.md:/app/src/agents/templates/IDENTITY.md:ro
      # Same fix for USER.md: the heartbeat's ensureAgentWorkspace requires it and the
      # image ships only USER.dev.md, so without this the heartbeat fails ("Missing
      # workspace template: USER.md") and the gateway never emits a fresh heartbeat.
      - ./mainframe/docs/reference/templates/USER.dev.md:/app/src/agents/templates/USER.md:ro
    expose:
      - "18789"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  opzava-pgdata:
  opzava-minio-data:
  openclaw-platform-config:
  openclaw-platform-workspace:
  openclaw-platform-auth-profiles:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
