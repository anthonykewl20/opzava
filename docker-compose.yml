services:
  mission-control:
    build:
      context: .
      args:
        INSTALL_AGENT_CLIS: ${INSTALL_AGENT_CLIS:-1}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-}
        NEXT_PUBLIC_GATEWAY_HOST: ${NEXT_PUBLIC_GATEWAY_HOST:-}
        NEXT_PUBLIC_GATEWAY_PORT: ${NEXT_PUBLIC_GATEWAY_PORT:-}
        NEXT_PUBLIC_GATEWAY_PROTOCOL: ${NEXT_PUBLIC_GATEWAY_PROTOCOL:-}
        NEXT_PUBLIC_GATEWAY_REVERSE_PROXY: ${NEXT_PUBLIC_GATEWAY_REVERSE_PROXY:-}
        NEXT_PUBLIC_GATEWAY_CLIENT_ID: ${NEXT_PUBLIC_GATEWAY_CLIENT_ID:-}
        NEXT_PUBLIC_GATEWAY_OPTIONAL: ${NEXT_PUBLIC_GATEWAY_OPTIONAL:-}
        NEXT_PUBLIC_COORDINATOR_AGENT: ${NEXT_PUBLIC_COORDINATOR_AGENT:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_FORCE_HTTPS: ${NEXT_PUBLIC_FORCE_HTTPS:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_CHAT_POLL_INTERVAL_MS: ${NEXT_PUBLIC_CHAT_POLL_INTERVAL_MS:-1000}
    container_name: mission-control
    ports:
      - "${MC_PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - HOME=/home/nextjs
      - MC_CLAUDE_HOME=${MC_CLAUDE_HOME:-/home/nextjs/.claude}
      - MC_HOST_SESSION_MODE=${MC_HOST_SESSION_MODE:-coexist}
      - PATH=/home/nextjs/.local/bin:/home/nextjs/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOCAL_LLM_ENDPOINT=${LOCAL_LLM_ENDPOINT:-http://host.docker.internal:1234/v1}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-}
      # ── Server-side gateway connection (MC backend → OpenClaw sidecar) ──
      # OpenClaw is Docker-managed for Opzava. Enable docker-compose-openclaw.yml
      # (OPENCLAW_ENABLED=1 make up) so this container name exists on mc-net.
      - OPENCLAW_GATEWAY_HOST=${OPENCLAW_GATEWAY_HOST:-mc-openclaw-gateway}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      # ── Browser-side gateway connection (user's browser → gateway) ──
      # NEXT_PUBLIC_GATEWAY_HOST must be reachable from the user's browser, NOT from
      # inside the container. For local Docker: leave empty (auto-detected from browser).
      # For remote/VPS: set to the public hostname or IP where the gateway is reachable.
      #
      # IMPORTANT: NEXT_PUBLIC_* variables are baked into the browser bundle at BUILD TIME,
      # not runtime. Setting them here only works if you rebuild the image:
      #   NEXT_PUBLIC_GATEWAY_HOST=oc.example.com docker compose build
      # Alternative: use the Advanced Settings on the login page to set the gateway URL
      # at runtime — it persists in localStorage and overrides the baked-in value.
      # Set these in .env before `docker compose build`; the build.args above bake them in.
      # NEXT_PUBLIC_GATEWAY_HOST=${NEXT_PUBLIC_GATEWAY_HOST:-}
      # NEXT_PUBLIC_GATEWAY_PORT=${NEXT_PUBLIC_GATEWAY_PORT:-18789}
      # Set to true if running without an OpenClaw gateway (standalone dashboard mode).
      # NEXT_PUBLIC_GATEWAY_OPTIONAL=true
    env_file:
      - path: .env
        required: false
    volumes:
      - mc-data:/app/.data
      # The OpenClaw state volume is mounted by docker-compose-openclaw.yml.
    # Allow optional local LLM endpoints on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
          pids: 256
    networks:
      - mc-net
    restart: unless-stopped

  # Standalone mode — no gateway required. Start with:
  #   docker compose --profile standalone up
  mission-control-standalone:
    extends:
      service: mission-control
    container_name: mission-control-standalone
    profiles:
      - standalone
    build:
      context: .
      args:
        INSTALL_AGENT_CLIS: ${INSTALL_AGENT_CLIS:-1}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-}
        NEXT_PUBLIC_GATEWAY_HOST: ${NEXT_PUBLIC_GATEWAY_HOST:-}
        NEXT_PUBLIC_GATEWAY_PORT: ${NEXT_PUBLIC_GATEWAY_PORT:-}
        NEXT_PUBLIC_GATEWAY_PROTOCOL: ${NEXT_PUBLIC_GATEWAY_PROTOCOL:-}
        NEXT_PUBLIC_GATEWAY_REVERSE_PROXY: ${NEXT_PUBLIC_GATEWAY_REVERSE_PROXY:-}
        NEXT_PUBLIC_GATEWAY_CLIENT_ID: ${NEXT_PUBLIC_GATEWAY_CLIENT_ID:-}
        NEXT_PUBLIC_GATEWAY_OPTIONAL: "true"
        NEXT_PUBLIC_COORDINATOR_AGENT: ${NEXT_PUBLIC_COORDINATOR_AGENT:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_FORCE_HTTPS: ${NEXT_PUBLIC_FORCE_HTTPS:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_CHAT_POLL_INTERVAL_MS: ${NEXT_PUBLIC_CHAT_POLL_INTERVAL_MS:-1000}
    environment:
      - PORT=${PORT:-3000}
      - NEXT_PUBLIC_GATEWAY_OPTIONAL=true

volumes:
  mc-data:

networks:
  mc-net:
    driver: bridge
