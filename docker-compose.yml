services:
  traefik:
    image: traefik:v3.6.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=dokploy-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "18088:80"
      - "18448:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dokploy-network

  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: opzava
      POSTGRES_USER: opzava
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - opzava-pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opzava -d opzava"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_URL: ${APP_URL:-http://web.opzava.localhost:18088}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://web.opzava.localhost:18088}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://opzava_app:opzava_app_local_only@postgres:5432/opzava}
      # DATABASE_MIGRATION_URL is intentionally not passed to runtime services.
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`web.opzava.localhost`)"
      traefik.http.routers.web.entrypoints: "web"
      traefik.http.services.web.loadbalancer.server.port: "3000"
      traefik.docker.network: "dokploy-network"
    networks:
      - dokploy-network

  openclaw-platform-gateway:
    profiles: ["openclaw"]
    # Official image per docs/openclaw/install/docker.md. Keep `latest` only until
    # the first verified real-Gateway run pins an exact OpenClaw version tag.
    image: ghcr.io/openclaw/openclaw:${OPENCLAW_IMAGE_TAG:-latest}
    command: ["node", "openclaw.mjs", "gateway", "--port", "18789", "--bind", "lan"]
    environment:
      OPENCLAW_SKIP_ONBOARDING: ${OPENCLAW_SKIP_ONBOARDING:-1}
      OPENCLAW_DISABLE_BONJOUR: ${OPENCLAW_DISABLE_BONJOUR:-1}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
    volumes:
      - openclaw-platform-config:/home/node/.openclaw
      - openclaw-platform-workspace:/home/node/.openclaw/workspace
      - openclaw-platform-auth-profiles:/home/node/.config/openclaw
    expose:
      - "18789"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  default:
  dokploy-network:
    external: true

volumes:
  opzava-pgdata:
  openclaw-platform-config:
  openclaw-platform-workspace:
  openclaw-platform-auth-profiles:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
