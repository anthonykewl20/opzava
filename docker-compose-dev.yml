services:
  mission-control:
    build:
      context: .
      target: deps
    container_name: mission-control-dev
    working_dir: /app
    command: >
      sh -lc "mkdir -p /home/nextjs/.local/bin /home/nextjs/.bun /home/nextjs/.claude &&
      pnpm install --frozen-lockfile &&
      pnpm dev --hostname 0.0.0.0 --port ${PORT:-3000}"
    ports:
      - "${MC_PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3000}
      - HOME=/home/nextjs
      - MC_CLAUDE_HOME=${MC_CLAUDE_HOME:-/home/nextjs/.claude}
      - MC_HOST_SESSION_MODE=${MC_HOST_SESSION_MODE:-coexist}
      - PATH=/home/nextjs/.local/bin:/home/nextjs/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - OPENCLAW_GATEWAY_HOST=${OPENCLAW_GATEWAY_HOST:-mc-openclaw-gateway}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOCAL_LLM_ENDPOINT=${LOCAL_LLM_ENDPOINT:-http://host.docker.internal:1234/v1}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - mc-dev-node-modules:/app/node_modules
      - mc-data:/app/.data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mc-net
    restart: unless-stopped

volumes:
  mc-data:
  mc-dev-node-modules:

networks:
  mc-net:
    driver: bridge
