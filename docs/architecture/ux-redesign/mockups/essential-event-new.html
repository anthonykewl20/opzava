<!doctype html>
<html lang="en" data-theme="calm">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opzava — New event</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="shadcn.css">
  <script src="theme-toggle.js"></script>
  <script src="a11y.js"></script>
  <script src="avatar-card.js"></script>
  <script src="account-menu.js"></script>
  <script src="menu-filter.js"></script>
  <script src="tools-bar.js"></script>
  <style>
    /* Basecamp-style Essential calm shell — layout only, no colour/font overrides */
    .bc { min-height: 100vh; font-size: var(--text-base); }
    .topbar { display: flex; align-items: center; gap: var(--space-5); height: 60px; padding: 0 var(--space-6); background: var(--surface); border-bottom: 1px solid var(--border); }
    .topnav { display: flex; align-items: center; gap: var(--space-1); }
    .topnav a { display: inline-flex; align-items: center; height: 36px; padding: 0 var(--space-3); border-radius: var(--radius-full); color: var(--fg-muted); text-decoration: none; font-weight: var(--fw-medium); }
    .topnav a:hover { background: var(--surface-2); color: var(--fg); text-decoration: none; }
    .ava { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: var(--text-xs); font-weight: var(--fw-semibold); color: #fff; flex: none; }

    /* ── Faded calendar workspace behind the dim (subtle hint only) ───────── */
    .bc-wrap { max-width: 1000px; margin: 0 auto; padding: var(--space-8) var(--space-6) var(--space-16); }
    .proj-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-6); }
    .proj-title { font-size: var(--text-2xl); font-weight: var(--fw-semibold); letter-spacing: -.02em; }
    .proj-sub { font-size: var(--text-sm); color: var(--fg-muted); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .cal-cell { background: var(--surface); min-height: 78px; padding: var(--space-2); }
    .cal-num { font-size: var(--text-xs); color: var(--fg-subtle); }
    .cal-pill { display: block; margin-top: 4px; font-size: var(--text-xs); color: var(--fg-muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 1px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── The Add-event DIALOG (reuses .sb-overlay dim + .wiz frame) ───────── */
    .wiz { width: 560px; max-width: 100%; margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); overflow: hidden; max-height: 92vh; display: flex; flex-direction: column; }
    .wiz-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-6) var(--space-4); border-bottom: 1px solid var(--border); }
    .wiz-title { font-size: var(--text-lg); font-weight: var(--fw-semibold); color: var(--fg); flex: 1 1 auto;  margin: 0;}
    .wiz-x { width: 30px; height: 30px; border: 0; border-radius: var(--radius-md); background: none; color: var(--fg-muted); font-size: 17px; cursor: pointer; flex: none; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .wiz-x:hover { background: var(--surface-2); color: var(--fg); }
    .wiz-body { padding: var(--space-5) var(--space-6); overflow-y: auto; }
    .wiz-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-6); border-top: 1px solid var(--border); background: var(--surface-2); }

    /* Manual fields */
    .field + .field { margin-top: var(--space-4); }
    .field-row { display: flex; gap: var(--space-4); margin-top: var(--space-4); }
    .field-row .field { flex: 1 1 0; min-width: 0; }
    .field-row .field + .field { margin-top: 0; }

    /* Status segmented control — glyph + label, never colour */
    .wiz-tabs { display: inline-flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 3px; }
    .wiz-tab { height: 30px; padding: 0 var(--space-3); border: 0; border-radius: var(--radius-full); background: none; color: var(--fg-muted); font: inherit; font-size: var(--text-sm); font-weight: var(--fw-medium); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .wiz-tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }

    /* Quiet ✦ Atlas offer line under the form */
    .add-atlas { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-5); padding-top: var(--space-4); border-top: 1px solid var(--border); font-size: var(--text-sm); color: var(--fg-muted); }
    .add-atlas a { color: var(--accent); text-decoration: none; font-weight: var(--fw-medium); }
    .add-atlas a:hover { text-decoration: underline; }
    .add-atlas .spark { color: var(--accent); flex: none; }

    @media (max-width: 640px) {
      .topnav { display: none; }
      .cal-grid { display: none; }
      .field-row { flex-direction: column; gap: var(--space-4); }
      .field-row .field + .field { margin-top: 0; }
    }
  </style>
</head>
<body>

  <!-- ════════ Faded Content Calendar behind the dim (subtle hint) ════════ -->
  <div class="bc" aria-hidden="true">
    <header class="topbar">
      <a href="essential-home.html" class="u-row" style="text-decoration:none;color:var(--fg);gap:var(--space-2)">
        <span class="rail-logo" style="display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-fg);font-weight:700" aria-hidden="true">◆</span>
        <strong style="font-size:var(--text-md)">Opzava</strong>
      </a>
      <nav class="topnav" aria-label="Primary">
        <a href="essential-home.html">Home</a>
        <a href="essential-my-stuff.html">My stuff</a>
        <a href="essential-messages.html">Messages</a>
        <a href="mention-inbox.html">Activity</a>
        <a href="essential-ask-opzava.html" style="gap:6px"><span aria-hidden="true" style="color:var(--accent)">✦</span> Ask Opzava</a>
        <a href="essential-find.html">Find…</a>
      </nav>
      <span class="u-grow"></span>
      <span class="ava" style="background:var(--chart-2)">AG</span>
    </header>

    <div class="bc-wrap">
      <div class="proj-head">
        <span class="proj-title">Content Calendar</span>
        <span class="proj-sub">· June 2026</span>
      </div>
      <div class="cal-grid">
        <div class="cal-cell"><span class="cal-num">15</span></div>
        <div class="cal-cell"><span class="cal-num">16</span><span class="cal-pill">Blog: case study</span></div>
        <div class="cal-cell"><span class="cal-num">17</span></div>
        <div class="cal-cell"><span class="cal-num">18</span><span class="cal-pill">Social: teaser</span></div>
        <div class="cal-cell"><span class="cal-num">19</span></div>
        <div class="cal-cell"><span class="cal-num">20</span></div>
        <div class="cal-cell"><span class="cal-num">21</span></div>
      </div>
    </div>
  </div>

  <!-- ════════ Add-event DIALOG (open over the dimmed calendar) ════════ -->
  <div class="sb-overlay open" role="dialog" aria-modal="true" aria-labelledby="evtTitle">
    <div class="wiz">

      <div class="wiz-head">
        <h1 class="wiz-title" id="evtTitle">Add to the calendar</h1>
        <a class="wiz-x" href="essential-mkt-calendar.html" aria-label="Close">✕</a>
      </div>

      <div class="wiz-body">

        <div class="field">
          <label class="label" for="e-what">What's going out</label>
          <input class="input" id="e-what" type="text" value="June newsletter" placeholder="e.g. June newsletter">
        </div>

        <div class="field">
          <label class="label" for="e-channel">Channel</label>
          <select class="select" id="e-channel">
            <option selected>Email</option>
            <option>Social</option>
            <option>Blog</option>
            <option>Paid</option>
          </select>
        </div>

        <div class="field">
          <label class="label" for="e-campaign">Campaign</label>
          <select class="select" id="e-campaign">
            <option selected>June Launch</option>
            <option>Webinar promo</option>
            <option>Fall Newsletter</option>
          </select>
        </div>

        <div class="field-row">
          <div class="field">
            <label class="label" for="e-date">Date</label>
            <input class="input" id="e-date" type="date" value="2026-06-17" aria-label="Date — Jun 17">
          </div>
          <div class="field">
            <label class="label" for="e-time">Time</label>
            <input class="input" id="e-time" type="text" value="9:00 am" placeholder="e.g. 9:00 am">
          </div>
        </div>

        <div class="field" style="margin-top:var(--space-4)">
          <span class="label" style="display:block;margin-bottom:var(--space-2)">Status</span>
          <div class="wiz-tabs" role="tablist" aria-label="Status">
            <button class="wiz-tab" role="tab" aria-selected="true" type="button"><span aria-hidden="true">◦</span> Draft</button>
            <button class="wiz-tab" role="tab" aria-selected="false" type="button"><span aria-hidden="true">●</span> Scheduled</button>
            <button class="wiz-tab" role="tab" aria-selected="false" type="button"><span aria-hidden="true">✓</span> Published</button>
          </div>
        </div>

        <p class="add-atlas"><span class="spark" aria-hidden="true">✦</span> <a href="essential-ask-opzava.html">Atlas can draft the copy and schedule it</a> — you review before it goes out.</p>

      </div>

      <div class="wiz-foot">
        <a class="btn btn-ghost" href="essential-mkt-calendar.html">Cancel</a>
        <a class="btn btn-primary" href="essential-mkt-calendar.html">Add to calendar</a>
      </div>

    </div>
  </div>

</body>
</html>
