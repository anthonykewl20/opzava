<!doctype html>
<html lang="en" data-theme="calm">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opzava — Signed out</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="shadcn.css">
  <script src="theme-toggle.js"></script>
  <script src="a11y.js"></script>
  <style>
    .so { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); background: var(--surface-2); }
    .so-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: var(--space-8) var(--space-7); text-align: center; }
    .so-logo { width: 44px; height: 44px; margin: 0 auto var(--space-5); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-fg); font-size: var(--text-xl); font-weight: 700; }
    .so-card h1 { font-size: var(--text-xl); font-weight: var(--fw-semibold); margin-bottom: var(--space-2); }
    .so-card p { font-size: var(--text-md); color: var(--fg-muted); margin-bottom: var(--space-6); line-height: var(--lh-relaxed); }
    .so-actions { display: flex; flex-direction: column; gap: var(--space-2); }
    .so-foot { margin-top: var(--space-6); font-size: var(--text-xs); color: var(--fg-subtle); }
  </style>
</head>
<body>
  <div class="so">
    <div class="so-card">
      <div class="so-logo" aria-hidden="true">◆</div>
      <h1>You've signed out</h1>
      <p>Thanks for using Opzava, Anthony. Your AI team keeps working — sign back in any time to pick up where you left off.</p>
      <div class="so-actions">
        <a class="btn btn-primary" href="essential-home.html" style="height:44px;font-size:var(--text-md)">Sign back in →</a>
        <a class="btn btn-ghost" href="essential-home.html">Back to Opzava</a>
      </div>
      <p class="so-foot">Signed out of this device only. To end other sessions, use <strong>Security</strong> in your profile.</p>
    </div>
  </div>
</body>
</html>
