# Optional OpenClaw gateway sidecar overlay.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose-openclaw.yml up -d --build
# or:
#   OPENCLAW_ENABLED=1 make up openclaw
services:
  mission-control:
    environment:
      - OPENCLAW_GATEWAY_HOST=mc-openclaw-gateway
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_INTERNAL_PORT:-18789}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_STATE_DIR=/home/nextjs/.openclaw
      - OPENCLAW_CONFIG_PATH=/home/nextjs/.openclaw/openclaw.json
      - NEXT_PUBLIC_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
    depends_on:
      - mc-openclaw-gateway
    volumes:
      - openclaw-data:/home/nextjs/.openclaw:ro

  mc-openclaw-gateway:
    image: ${OPENCLAW_GATEWAY_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: mc-openclaw-gateway
    env_file:
      - path: .env.openclaw
        required: false
      - path: .env
        required: false
    environment:
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_INTERNAL_PORT:-18789}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_CONTROL_UI_PORT=${OPENCLAW_CONTROL_UI_PORT:-18791}
      - OPENCLAW_TOOLS_PROFILE=${OPENCLAW_TOOLS_PROFILE:-coding}
      - OPENCLAW_SECURITY_WORKSPACE_ONLY=${OPENCLAW_SECURITY_WORKSPACE_ONLY:-1}
      - OPENCLAW_SECURITY_DENY_AUTOMATION=${OPENCLAW_SECURITY_DENY_AUTOMATION:-1}
      - OPENCLAW_SECURITY_DENY_RUNTIME=${OPENCLAW_SECURITY_DENY_RUNTIME:-1}
      - OPENCLAW_SECURITY_DENY_FS=${OPENCLAW_SECURITY_DENY_FS:-0}
      - OPENCLAW_SECURITY_SANDBOX_ALL=${OPENCLAW_SECURITY_SANDBOX_ALL:-0}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_NUMERIC_USER_ID=${TELEGRAM_NUMERIC_USER_ID:-}
      - TELEGRAM_DM_POLICY=${TELEGRAM_DM_POLICY:-pairing}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM:-}
      - TELEGRAM_OWNER_ALLOW_FROM=${TELEGRAM_OWNER_ALLOW_FROM:-}
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:${OPENCLAW_GATEWAY_INTERNAL_PORT:-18789}"
      - "${OPENCLAW_CONTROL_UI_PORT:-18791}:18791"
    volumes:
      - openclaw-data:/root/.openclaw
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        create_host_path: false
    networks:
      - mc-net
    restart: unless-stopped

volumes:
  openclaw-data:
