# Local Dokploy-parity stack.
#
# Purpose: run Opzava the way a Dokploy Docker Compose app is reached in
# production: production image, runtime env from .env/env_file, app port exposed
# only to a Traefik network, and browser traffic routed through Traefik labels.
#
# Start:
#   docker compose -f docker-compose.dokploy.yml up -d --build
# Test:
#   DOKPLOY_PARITY_RUN_E2E=1 bash scripts/dokploy-parity-test.sh

services:
  dokploy-traefik:
    image: ${DOKPLOY_TRAEFIK_IMAGE:-traefik:v3.7.5}
    container_name: opzava-dokploy-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.forwardedHeaders.insecure=true
      - --api.dashboard=false
    ports:
      - "${DOKPLOY_HTTP_PORT:-3080}:80"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks:
      - dokploy-network
    restart: unless-stopped

  mission-control:
    image: ${OPZAVA_IMAGE:-opzava-dokploy-local}
    build:
      context: .
      args:
        INSTALL_AGENT_CLIS: ${INSTALL_AGENT_CLIS:-1}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-}
        NEXT_PUBLIC_GATEWAY_HOST: ${NEXT_PUBLIC_GATEWAY_HOST:-}
        NEXT_PUBLIC_GATEWAY_PORT: ${NEXT_PUBLIC_GATEWAY_PORT:-}
        NEXT_PUBLIC_GATEWAY_PROTOCOL: ${NEXT_PUBLIC_GATEWAY_PROTOCOL:-}
        NEXT_PUBLIC_GATEWAY_REVERSE_PROXY: ${NEXT_PUBLIC_GATEWAY_REVERSE_PROXY:-}
        NEXT_PUBLIC_GATEWAY_CLIENT_ID: ${NEXT_PUBLIC_GATEWAY_CLIENT_ID:-}
        NEXT_PUBLIC_GATEWAY_OPTIONAL: ${NEXT_PUBLIC_GATEWAY_OPTIONAL:-true}
        NEXT_PUBLIC_COORDINATOR_AGENT: ${NEXT_PUBLIC_COORDINATOR_AGENT:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_FORCE_HTTPS: ${NEXT_PUBLIC_FORCE_HTTPS:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_CHAT_POLL_INTERVAL_MS: ${NEXT_PUBLIC_CHAT_POLL_INTERVAL_MS:-1000}
    expose:
      - "${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - HOME=/home/nextjs
      - API_KEY=${API_KEY:-test-api-key-e2e-12345}
      - AUTH_USER=${AUTH_USER:-testadmin}
      - AUTH_PASS=${AUTH_PASS:-testpass1234!}
      - MC_DISABLE_RATE_LIMIT=${MC_DISABLE_RATE_LIMIT:-1}
      - MC_ALLOWED_HOSTS=${MC_ALLOWED_HOSTS:-opzava.localhost,localhost,127.0.0.1}
      - MC_CLAUDE_HOME=${MC_CLAUDE_HOME:-/home/nextjs/.claude}
      - MC_HOST_SESSION_MODE=${MC_HOST_SESSION_MODE:-coexist}
      - PATH=/home/nextjs/.local/bin:/home/nextjs/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - OPENCLAW_GATEWAY_HOST=${OPENCLAW_GATEWAY_HOST:-mc-openclaw-gateway}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOCAL_LLM_ENDPOINT=${LOCAL_LLM_ENDPOINT:-http://host.docker.internal:1234/v1}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - mc-dokploy-data:/app/.data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
          pids: 256
    labels:
      - traefik.enable=true
      - traefik.http.routers.opzava-dokploy-local.rule=Host(`${DOKPLOY_LOCAL_DOMAIN:-opzava.localhost}`)
      - traefik.http.routers.opzava-dokploy-local.entrypoints=web
      - traefik.http.services.opzava-dokploy-local.loadbalancer.server.port=${PORT:-3000}
      - traefik.http.services.opzava-dokploy-local.loadbalancer.sticky.cookie=true
      - traefik.http.services.opzava-dokploy-local.loadbalancer.sticky.cookie.name=opzava_dokploy_affinity
      - traefik.http.services.opzava-dokploy-local.loadbalancer.sticky.cookie.httpOnly=true
    depends_on:
      - dokploy-traefik
    networks:
      - dokploy-network
    restart: unless-stopped

  mc-openclaw-gateway:
    profiles:
      - openclaw
    image: ${OPENCLAW_GATEWAY_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: opzava-dokploy-openclaw-gateway
    expose:
      - "${OPENCLAW_GATEWAY_INTERNAL_PORT:-18789}"
    environment:
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_INTERNAL_PORT:-18789}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_TOOLS_PROFILE=${OPENCLAW_TOOLS_PROFILE:-coding}
      - OPENCLAW_SECURITY_WORKSPACE_ONLY=${OPENCLAW_SECURITY_WORKSPACE_ONLY:-1}
      - OPENCLAW_SECURITY_DENY_AUTOMATION=${OPENCLAW_SECURITY_DENY_AUTOMATION:-1}
      - OPENCLAW_SECURITY_DENY_RUNTIME=${OPENCLAW_SECURITY_DENY_RUNTIME:-1}
      - OPENCLAW_SECURITY_DENY_FS=${OPENCLAW_SECURITY_DENY_FS:-0}
      - OPENCLAW_SECURITY_SANDBOX_ALL=${OPENCLAW_SECURITY_SANDBOX_ALL:-1}
    volumes:
      - openclaw-dokploy-data:/root/.openclaw
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    labels:
      - traefik.enable=true
      - traefik.http.routers.opzava-dokploy-gateway.rule=Host(`${DOKPLOY_GATEWAY_LOCAL_DOMAIN:-opzava-gateway.localhost}`)
      - traefik.http.routers.opzava-dokploy-gateway.entrypoints=web
      - traefik.http.services.opzava-dokploy-gateway.loadbalancer.server.port=${OPENCLAW_GATEWAY_INTERNAL_PORT:-18789}
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  mc-dokploy-data:
  openclaw-dokploy-data:

networks:
  dokploy-network:
    driver: bridge
