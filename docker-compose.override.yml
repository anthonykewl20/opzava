# Local development overrides — auto-merged by `docker compose` on this machine.
# Dokploy deploys consume docker-compose.yml ONLY, so nothing here reaches live.
# Exposes the Traefik dashboard at http://localhost:18089 for local routing debug.
# `command` replaces the base list (Compose merge rule), so it is restated in full;
# `ports` concatenate, so only the extra dashboard port is added here.
services:
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=dokploy-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "18089:8080"

  postgres:
    ports:
      - "15432:5432"

  # Local-only host access for the dev broker/bootstrap scripts; live keeps the
  # Gateway unreachable from outside the compose network (expose-only).
  # Host port 18799: 18789 is taken by the developer's own local OpenClaw.
  openclaw-platform-gateway:
    ports:
      - "18799:18789"
